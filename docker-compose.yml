services:
  app:
    build: .
    container_name: custom-crm-app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    env_file:
      - .env
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app --reload-delay 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

volumes:
  pip_cache:
