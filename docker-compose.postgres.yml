services:
  app:
    environment:
      - DATABASE_URL=postgresql+psycopg://crm:crm@db:5432/crm
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: custom-crm-db
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
